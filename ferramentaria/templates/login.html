<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PGR Canpack</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.0.3/src/bold/style.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1e3a5f 0%, #0f172a 100%);
            overflow: hidden;
            color: white;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 2.5rem;
            text-align: center;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-avatar {
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            margin: 0 auto 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .user-avatar i {
            font-size: 4rem;
            color: rgba(255, 255, 255, 0.8);
        }

        .welcome-text {
            font-size: 1.8rem;
            font-weight: 300;
            margin-bottom: 2rem;
            letter-spacing: -0.5px;
        }

        .input-group {
            margin-bottom: 1rem;
            position: relative;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s;
        }

        .input-group input:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 0.5rem;
        }

        .btn-login:hover {
            background: #2563eb;
            transform: translateY(-1px);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .sso-options {
            margin-top: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .sso-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.7);
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .sso-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border-color: rgba(255, 255, 255, 0.4);
        }

        .error-msg {
            color: #f87171;
            font-size: 0.85rem;
            margin-top: 1rem;
            display: none;
        }

        .loading-dots:after {
            content: ' .';
            animation: dots 1s steps(5, end) infinite;
        }

        @keyframes dots {
            0%, 20% { color: rgba(0,0,0,0); text-shadow: .25em 0 0 rgba(0,0,0,0), .5em 0 0 rgba(0,0,0,0); }
            40% { color: white; text-shadow: .25em 0 0 rgba(0,0,0,0), .5em 0 0 rgba(0,0,0,0); }
            60% { text-shadow: .25em 0 0 white, .5em 0 0 rgba(0,0,0,0); }
            80%, 100% { text-shadow: .25em 0 0 white, .5em 0 0 white; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="user-avatar">
            <i class="ph-bold ph-user"></i>
        </div>
        <h1 class="welcome-text" id="welcomeText">Entrar no PGR</h1>
        
        <form id="loginForm">
            <div class="input-group">
                <input type="text" id="username" placeholder="Usuário" required autocomplete="username">
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Senha" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn-login" id="btnLogin">Entrar</button>
        </form>

        <div class="error-msg" id="errorMsg">Usuário ou senha inválidos.</div>

        <div class="sso-options">
            <button class="sso-btn" onclick="mockWindowsAuth()">
                <i class="ph-bold ph-microsoft-windows"></i>
                Entrar com Windows Hello
            </button>
            <div style="font-size: 0.75rem; color: rgba(255,255,255,0.4);">
                Conectado ao domínio CANPACK
            </div>
        </div>
    </div>

    <script>
        const API_URL = '';

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('btnLogin');
            const error = document.getElementById('errorMsg');

            btn.disabled = true;
            btn.innerHTML = 'Entrando<span class="loading-dots"></span>';
            error.style.display = 'none';

            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (!response.ok) throw new Error();

                const data = await response.json();
                localStorage.setItem('pgr_token', data.access_token);
                
                // Redireciona para o dashboard
                window.location.href = '/';
            } catch (err) {
                error.style.display = 'block';
                btn.disabled = false;
                btn.innerHTML = 'Entrar';
            }
        });

        async function mockWindowsAuth() {
            // No futuro, isso usaria webauthn ou um endpoint de SSO
            alert('Aguardando resposta do Kerberos (CANPACK Domain)...');
            // Mock de sucesso
            document.getElementById('username').value = 'usuario.win';
            document.getElementById('password').value = '********';
        }
    </script>
</body>
</html>
